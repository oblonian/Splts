name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/decentralized-splitwise-feasibility-om5x3h
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Run core tests
        run: npm test

      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: splts-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Rename universal APK for release
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk splts.apk

      - name: Build arm64-only APK (smaller download for modern phones)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename arm64 APK for release
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk splts-arm64.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch APK in emulator and capture logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r splts.apk
            adb logcat -c
            adb shell am start -n org.splts.app/.MainActivity
            sleep 30
            adb exec-out screencap -p > emulator-screenshot.png
            adb logcat -d > emulator-logcat.txt
            if ! adb shell pidof org.splts.app; then
              echo "::error::App process is not running 30s after launch"
              grep -B 2 -A 60 "FATAL EXCEPTION" emulator-logcat.txt || true
              exit 1
            fi
            if grep -q "FATAL EXCEPTION" emulator-logcat.txt; then
              echo "::error::FATAL EXCEPTION in logcat"
              grep -B 2 -A 60 "FATAL EXCEPTION" emulator-logcat.txt
              exit 1
            fi
            echo "App launched and is running."

      - name: Upload emulator logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke
          path: |
            emulator-logcat.txt
            emulator-screenshot.png
          if-no-files-found: ignore

      - name: Publish APKs to the "latest" pre-release
        if: always() && hashFiles('splts-arm64.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Splts (latest build)
          prerelease: true
          files: |
            splts.apk
            splts-arm64.apk
          body: |
            Automated build from ${{ github.sha }}.

            - **splts-arm64.apk** — smaller; works on virtually every phone from ~2016 onwards. Try this first.
            - **splts.apk** — universal (all CPU types), larger.

            Sideload on Android: download an APK, open it, and allow
            installs from your browser when prompted.

name: Build apps

on:
  workflow_dispatch:
  push:
    branches:
      - claude/decentralized-splitwise-feasibility-om5x3h
      - main

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install
        env:
          CI: 1

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build unsigned archive
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace Splts.xcworkspace -scheme Splts \
            -configuration Release -sdk iphoneos \
            -archivePath build/Splts.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r apps/mobile/ios/build/Splts.xcarchive/Products/Applications/*.app Payload/
          zip -qry splts-unsigned.ipa Payload
          ls -la splts-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: splts-unsigned-ipa
          path: splts-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish IPA to the "latest" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          prerelease: true
          files: splts-unsigned.ipa

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Run core tests
        run: npm test

      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: splts-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Rename universal APK for release
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk splts.apk

      - name: Build arm64-only APK (smaller download for modern phones)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename arm64 APK for release
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk splts-arm64.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch APK in emulator and capture logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # The action runs each script line as a separate shell; keep it one line.
          script: bash .github/scripts/emulator-smoke.sh

      - name: Upload emulator logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke
          path: |
            emulator-logcat.txt
            emulator-screenshot.png
          if-no-files-found: ignore

      - name: Publish APKs to the "latest" pre-release
        if: always() && hashFiles('splts-arm64.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Splts (latest build)
          prerelease: true
          files: |
            splts.apk
            splts-arm64.apk
          body: |
            Automated build from ${{ github.sha }}.

            - **splts-arm64.apk** — Android; smaller, works on virtually every phone from ~2016 onwards. Try this first.
            - **splts.apk** — Android universal (all CPU types), larger.
            - **splts-unsigned.ipa** — iOS, unsigned. Apple doesn't allow direct sideloading: install it with [AltStore](https://altstore.io) or Sideloadly using your (free) Apple ID.

            Sideload on Android: download an APK, open it, and allow
            installs from your browser when prompted.
